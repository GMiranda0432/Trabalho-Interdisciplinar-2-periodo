<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Geral</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- O index.html é a própria tela de Visão Geral (não fica na pasta pags) -->
    <div class="app">
        <aside class="sidebar">
            <div class="logo">Gestão de Competições</div>
            <nav>
                <ul class="menu">
                    <li><a class="ativo" href="index.html">Visão Geral</a></li>
                    <li><a href="pags/atletas.html">Atletas</a></li>
                    <li><a href="pags/comps.html">Competições</a></li>
                    <li><a href="pags/relatorio.html">Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header class="cabecalho">
                <div>
                    <h1>Visão Geral</h1>
                    <p class="subtitulo">Gerencie os atletas e as competições cadastradas.</p>
                </div>
            </header>

            <section class="grade-dados">
                <article class="cartao-dado">
                    <h3>Atletas Cadastrados</h3>
                    <p class="valor" id="quantidadeAtletas">0</p>
                </article>
                <article class="cartao-dado">
                    <h3>Competições Cadastradas</h3>
                    <p class="valor" id="quantidadeCompeticoes">0</p>
                </article>
            </section>

            <h2 class="titulo-secao">Acesso Rápido</h2>
            <section class="grade-acesso">
                <a class="cartao-acesso" href="pags/cadastroAtleta.html">
                    <span class="icone">+</span>
                    <span>Cadastrar Atleta</span>
                </a>
                <a class="cartao-acesso" href="pags/cadastroComp.html">
                    <span class="icone">+</span>
                    <span>Cadastrar Competição</span>
                </a>
                <a class="cartao-acesso" href="pags/inscricao.html">
                    <span class="icone">+</span>
                    <span>Realizar Inscrição</span>
                </a>
                <a class="cartao-acesso" href="pags/relatorio.html">
                    <span class="icone">=</span>
                    <span>Consultar Relatórios</span>
                </a>
            </section>
        </main>
    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
