<!DOCTYPE html>
<!-- Página de cadastro de Atleta: um formulário que o JS lê, valida e salva -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Atleta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app">
        <!-- Menu lateral padrão; "ativo" marca que estamos na área de Atletas -->
        <aside class="sidebar">
            <div class="logo">Gestão de Competições</div>
            <nav>
                <ul class="menu">
                    <li><a href="../index.html">Visão Geral</a></li>
                    <li><a class="ativo" href="atletas.html">Atletas</a></li>
                    <li><a href="comps.html">Competições</a></li>
                    <li><a href="relatorio.html">Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header class="cabecalho">
                <div>
                    <h1>Novo Atleta</h1>
                    <p class="subtitulo">Preencha os dados para cadastrar um atleta</p>
                </div>
            </header>

            <!-- novalidate desliga a validação "nativa" do navegador; quem valida é o nosso JS -->
            <form id="formAtleta" novalidate>
                <div class="form-caixa">
                    <h2>Dados do atleta</h2>
                    <!-- Grade que organiza os campos; cada campo-grupo = label + input -->
                    <div class="form-grade">
                        <!-- largura-total = ocupa a linha inteira -->
                        <div class="campo-grupo largura-total">
                            <label for="atletaNome">Nome Completo <span class="obrig">*</span></label>
                            <input class="campo" id="atletaNome" type="text" placeholder="Informe o nome completo">
                        </div>
                        <div class="campo-grupo">
                            <label for="atletaCpf">CPF <span class="obrig">*</span></label>
                            <!-- O JS aplica a máscara 000.000.000-00 enquanto digita -->
                            <input class="campo" id="atletaCpf" type="text" placeholder="000.000.000-00">
                        </div>
                        <div class="campo-grupo">
                            <label for="atletaNascimento">Data de Nascimento <span class="obrig">*</span></label>
                            <!-- type="date" mostra o calendário e devolve aaaa-mm-dd -->
                            <input class="campo" id="atletaNascimento" type="date">
                        </div>
                        <div class="campo-grupo largura-total">
                            <label for="atletaEmail">E-mail <span class="obrig">*</span></label>
                            <!-- type="email" já ajuda o celular a mostrar o teclado certo -->
                            <input class="campo" id="atletaEmail" type="email" placeholder="nome@dominio.com">
                        </div>
                        <div class="campo-grupo">
                            <label for="atletaModalidade">Modalidade <span class="obrig">*</span></label>
                            <select class="campo" id="atletaModalidade">
                                <!-- Opção vazia = nada escolhido; o JS recusa se ficar assim -->
                                <option value="">Selecione a modalidade</option>
                                <option value="Maratona">Maratona</option>
                                <option value="Trail Running">Trail Running</option>
                            </select>
                        </div>
                        <div class="campo-grupo">
                            <label for="atletaPeso">Peso (kg) <span class="obrig">*</span></label>
                            <!-- step="0.1" permite uma casa decimal; min="0" impede negativo no campo -->
                            <input class="campo" id="atletaPeso" type="number" step="0.1" min="0" placeholder="Informe o peso">
                        </div>
                    </div>
                    <!-- Legenda do asterisco -->
                    <p class="nota-obrig"><span class="obrig">*</span> Campos Obrigatórios</p>
                </div>
                <div class="form-acoes">
                    <!-- Cancelar volta para a lista; o submit dispara o cadastro no JS -->
                    <a class="btn btn-secundario" href="atletas.html">Cancelar</a>
                    <button class="btn btn-primario" type="submit">Cadastrar Atleta</button>
                </div>
            </form>
        </main>
    </div>

    <!-- Script da tela: lê o formulário, valida com validarAtleta e salva no localStorage -->
    <script type="module" src="../js/pags/cadastroAtleta.js"></script>
</body>
</html>
