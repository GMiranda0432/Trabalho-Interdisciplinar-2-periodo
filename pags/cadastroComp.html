<!DOCTYPE html>
<!-- Página de Nova Competição. O formulário tem campos comuns + dois blocos que aparecem
     conforme o "Tipo de corrida": um para Maratona e outro para Trail Running -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Competição</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app">
        <!-- Menu lateral padrão; "ativo" marca Competições -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-text">Largada</div>
                <span class="barra-amarela" aria-hidden="true"></span>
            <p class="subtitulo">Gestão inteligente de corridas e atletas.</p>
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="../index.html"><span class="nav-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></span>Visão Geral</a></li>
                    <li><a href="atletas.html"><span class="nav-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5.2a3 3 0 0 1 0 5.6M18 14a5 5 0 0 1 3 4.6V20"></path></svg></span>Atletas</a></li>
                    <li><a class="ativo" href="comps.html"><span class="nav-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM8 6H5v2a4 4 0 0 0 4 4M16 6h3v2a4 4 0 0 1-4 4M12 12v5m-4 3h8m-7-3h6"></path></svg></span>Competições</a></li>
                    <li><a href="relatorio.html"><span class="nav-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 17v-5m6 5V7m6 10v-8"></path></svg></span>Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header class="cabecalho">
                <div>
                    <h1>Nova Competição</h1>
                    <p class="subtitulo">Preencha os dados para criar uma competição</p>
                </div>
            </header>

            <form id="formCompeticao" novalidate>
                <div class="form-caixa">
                    <h2>Dados da competição</h2>
                    <div class="form-grade">
                        <div class="campo-grupo">
                            <label for="compNome">Nome da competição <span class="obrig">*</span></label>
                            <input class="campo" id="compNome" type="text" placeholder="Insira o nome da competição">
                        </div>
                        <div class="campo-grupo">
                            <label for="compData">Data <span class="obrig">*</span></label>
                            <input class="campo" id="compData" type="date">
                        </div>
                        <div class="campo-grupo">
                            <label for="compLocal">Local <span class="obrig">*</span></label>
                            <input class="campo" id="compLocal" type="text" placeholder="Insira o nome do local">
                        </div>
                        <div class="campo-grupo">
                            <span class="rotulo">Horários da competição</span>
                            <!-- Dois campos de hora; o JS valida que o "Fim" seja maior que o "Início" -->
                            <div class="horarios">
                                <div class="campo-grupo">
                                    <label for="compHorario">Início</label>
                                    <input class="campo" id="compHorario" type="time">
                                </div>
                                <div class="campo-grupo">
                                    <label for="compHorarioFim">Fim</label>
                                    <input class="campo" id="compHorarioFim" type="time">
                                </div>
                            </div>
                        </div>
                        <div class="campo-grupo">
                            <label for="compDistancia">Distância <span class="obrig">*</span></label>
                            <!-- campo-medida junta o input + a "unidade" (km) ao lado -->
                            <div class="campo-medida">
                                <input class="campo" id="compDistancia" type="number" step="0.01" min="0" placeholder="Insira a distância">
                                <span class="unidade">km</span>
                            </div>
                        </div>
                        <div class="campo-grupo">
                            <label for="tipo">Tipo de corrida <span class="obrig">*</span></label>
                            <!-- Trocar este select mostra/esconde os blocos Maratona/Trail abaixo -->
                            <select class="campo" id="tipo">
                                <option value="">Escolha uma opção</option>
                                <option value="Maratona">Maratona</option>
                                <option value="TrailRunning">Trail Running</option>
                            </select>
                        </div>
                        <div class="campo-grupo largura-total">
                            <label for="compAltimetria">Altimetria</label>
                            <!-- Altimetria é opcional (sem "*") -->
                            <div class="campo-medida">
                                <input class="campo" id="compAltimetria" type="number" step="0.01" min="0" placeholder="Insira a altimetria">
                                <span class="unidade">m</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bloco exclusivo da Maratona; o JS mostra/esconde adicionando/removendo "oculto" -->
                    <div class="campos-maratona campos-tipo">
                        <h2>Dados da Maratona</h2>
                        <div class="form-grade">
                            <div class="campo-grupo">
                                <label for="compObjetivo">Objetivo</label>
                                <input class="campo" id="compObjetivo" type="text" placeholder="Ex.: Percurso urbano plano">
                            </div>
                            <div class="campo-grupo">
                                <label for="compFechamentoVias">Fechamento das vias</label>
                                <input class="campo" id="compFechamentoVias" type="text" placeholder="Ex.: 06:00 as 12:00">
                            </div>
                            <div class="campo-grupo">
                                <label for="compPontosHidratacao">Pontos de hidratação</label>
                                <input class="campo" id="compPontosHidratacao" type="number" min="0" step="1" placeholder="Quantidade de pontos">
                            </div>
                        </div>
                    </div>

                    <!-- Bloco exclusivo do Trail Running (mesma lógica de mostrar/esconder) -->
                    <div class="campos-trail campos-tipo">
                        <h2>Dados do Trail Running</h2>
                        <div class="form-grade">
                            <div class="campo-grupo">
                                <label for="compCheckPoint">Check point</label>
                                <input class="campo" id="compCheckPoint" type="text" placeholder="Ex.: CP1 - Mirante">
                            </div>
                            <div class="campo-grupo">
                                <label for="compGrauDificuldade">Grau de dificuldade</label>
                                <input class="campo" id="compGrauDificuldade" type="text" placeholder="Ex.: Difícil">
                            </div>
                            <div class="campo-grupo">
                                <label for="compClimaEsperado">Clima esperado</label>
                                <input class="campo" id="compClimaEsperado" type="text" placeholder="Ex.: Sol com nuvens">
                            </div>
                        </div>
                    </div>

                    <p class="nota-obrig"><span class="obrig">*</span> Campos Obrigatórios</p>
                </div>
                <div class="form-acoes">
                    <a class="btn btn-secundario" href="comps.html">Cancelar</a>
                    <button class="btn btn-primario" type="submit">Criar Competição</button>
                </div>
            </form>
        </main>
    </div>

    <script type="module" src="../js/pags/cadastroComp.js"></script>
</body>
</html>
